<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todaytask</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0%;
        padding: 0%;
        background-color: white;
      }
      .container {
        width: 80%;
        margin: 40px auto;
        border: 3px solid black;
        padding: 15px;
        border-radius: 5px;

        display: grid;
        grid-template-columns: 2fr 1fr;
        grid-template-rows: 90px 90px 150px 150px 90px;
        gap: 15px;
      }
      .header {
        background-color: #ff2e31;
        grid-column: 1/3;
        border: 2px solid black;
        border-radius: 5px;
      }
      .navigation {
        background-color: #13bedc;
        grid-column: 1/3;
        border: 2px solid black;
        border-radius: 5px;
      }
      .content1 {
        background-color: #ffbc54;
        border: 2px solid black;
        border-radius: 5px;
      }
      .content2 {
        background-color: #fe8d47;
        border: 2px solid black;
        border-radius: 5px;
      }
      .sidebar {
        background-color: #ff64c0;
        grid-column: 2;
        grid-row: 3/5;
        border: 2px solid black;
        border-radius: 5px;
      }
      .footer {
        background-color: #707070;
        grid-column: 1/3;
        border: 2px solid black;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <main class="container">

      <header class="header"> </header>

      <nav class="navigation"> </nav>

      <article class="content1"> </article>

      <article class="content2"> </article>

      <aside class="sidebar"> </aside>

      <footer class="footer"> </footer>
      
    </main>
  </body>
</html>
